# Experiment: can the phone app use Python 3.13 + curl_cffi (helps Instagram and other picky sites)?
name: Try Python 3.13
on: workflow_dispatch
jobs:
  try:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q -o source.zip -d .
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Switch to 3.13 + curl_cffi
        run: |
          sed -i 's/version = "3.12"/version = "3.13"/; s/install("markupsafe==3.0.3")/install("markupsafe")/; s/install("certifi")/install("certifi")\n            install("yt-dlp-ejs")\n            install("curl_cffi")/' app/build.gradle.kts
          sed -i 's/Python312/Python313/' app/build.gradle.kts
          grep -n "install\|version =" app/build.gradle.kts
      - run: gradle assembleDebug --no-daemon
      - name: What got installed
        if: always()
        run: find app/build -path "*pip*" -maxdepth 8 -type d -name "*.dist-info" | sed 's#.*/##' | sort -u | head -80
