# Builds the Grabby Android app and publishes it as a GitHub Release.
# Runs when you push a version tag like v4.1, or when you press "Run workflow" on the Actions tab.
# Phones with Grabby installed see "update available" as soon as the release is out.
name: Build Grabby app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the app source
        run: |
          unzip -q -o source.zip -d .
          ls

      - name: Phone helpers (reuse last build if nothing changed)
        id: nat
        uses: actions/cache@v4
        with:
          path: natives
          key: natives-${{ hashFiles('tools/build-natives.sh') }}

      - name: Build phone helpers (QuickJS for YouTube + ffmpeg)
        if: steps.nat.outputs.cache-hit != 'true'
        run: bash tools/build-natives.sh natives

      - name: Put the helpers into the app
        run: |
          mkdir -p app/src/main/jniLibs
          cp -r natives/arm64-v8a app/src/main/jniLibs/      # phones only (keeps the download small)
          ls -laR app/src/main/jniLibs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5        # Chaquopy needs the same Python version as the app (3.12)
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Read version
        id: ver
        run: echo "v=$(tr -d '[:space:]' < app/src/main/python/vidgrab/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Signing key (from the private repository secrets)
        env:
          KS: ${{ secrets.GRABBY_KEYSTORE }}
          GRABBY_KS_PASS: ${{ secrets.GRABBY_KS_PASS }}
        run: |
          if [ -z "$KS" ] || [ -z "$GRABBY_KS_PASS" ]; then echo "::error::Add the GRABBY_KEYSTORE and GRABBY_KS_PASS secrets (Settings > Secrets and variables > Actions)"; exit 1; fi
          echo "$KS" | base64 -d > grabby-release.jks

      - name: Build APK
        env:
          GRABBY_KS_PASS: ${{ secrets.GRABBY_KS_PASS }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name it Grabby.apk
        run: cp app/build/outputs/apk/release/app-release.apk Grabby.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Grabby ${{ steps.ver.outputs.v }}
          files: Grabby.apk
          make_latest: true
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true

  # ---------------------------------------------------------------- Windows app (Grabby-Windows.exe)
  windows:
    needs: build          # only after the phone app built fine, so both always come out together
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the app source
        shell: bash
        run: unzip -q -o source.zip -d .

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version
        id: ver
        shell: bash
        run: echo "v=$(tr -d '[:space:]' < app/src/main/python/vidgrab/VERSION)" >> "$GITHUB_OUTPUT"

      - name: QuickJS for Windows (lets YouTube work)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.18.0 -R quickjs-ng/quickjs -p "qjs-windows-x86_64.exe" -O desktop/qjs.exe \
            || gh release download -R quickjs-ng/quickjs -p "qjs-windows-x86_64.exe" -O desktop/qjs.exe
          ls -la desktop

      - name: Build Grabby-Windows.exe
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller flask yt-dlp yt-dlp-ejs imageio-ffmpeg certifi pillow pywebview pythonnet
          cp -r app/src/main/python/vidgrab desktop/vidgrab
          rm -rf desktop/vidgrab/__pycache__ desktop/vidgrab/server.py
          python -c "from PIL import Image; Image.open('desktop/vidgrab/static/icons/icon-512.png').convert('RGBA').save('desktop/grabby.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
          cd desktop
          pyinstaller --noconfirm --onefile --windowed --name Grabby-Windows --icon grabby.ico \
            --add-data "vidgrab;vidgrab" --add-data "grabby.ico;." --add-binary "qjs.exe;." \
            --collect-all yt_dlp --collect-all yt_dlp_ejs --collect-all imageio_ffmpeg --collect-submodules flask \
            --collect-all webview --collect-all clr_loader --collect-all pythonnet --hidden-import clr \
            --hidden-import vidgrab.app --hidden-import vidgrab.qr --hidden-import vidgrab.vault \
            grabby_desktop.py
          ls -la dist

      - name: Check that it installs and opens in its own window
        shell: bash
        run: |
          ./desktop/dist/Grabby-Windows.exe &
          for i in $(seq 1 90); do curl -s localhost:5000/api/health && break; sleep 2; done
          echo
          curl -s localhost:5000/api/health | grep '"desktop":true'
          L="$LOCALAPPDATA"
          echo "--- installed files"; ls -la "$L/Programs/Grabby"
          test -f "$L/Programs/Grabby/Grabby.exe"
          echo "--- Apps & features entry"
          reg query 'HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall\Grabby'
          echo "--- shortcuts"; ls -la "$APPDATA/Microsoft/Windows/Start Menu/Programs/Grabby.lnk"
          sleep 12
          echo "--- log"; cat "$L/Grabby/grabby.log" || true
          if grep -q "app window failed" "$L/Grabby/grabby.log"; then echo "::error::Grabby could not open its own window"; exit 1; fi
          echo "--- open again: must bring the window to the front, not start a second copy"
          "$L/Programs/Grabby/Grabby.exe" & sleep 8
          test "$(tasklist //FI 'IMAGENAME eq Grabby.exe' | grep -c Grabby.exe)" -le 2
          curl -s -X POST -H "Content-Type: application/json" -d "{}" localhost:5000/api/quit || true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Grabby ${{ steps.ver.outputs.v }}
          files: desktop/dist/Grabby-Windows.exe
          make_latest: true
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
